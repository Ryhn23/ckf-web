services:
  db:
    image: postgres:15-alpine
    container_name: ckf-web-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ckf
      POSTGRES_PASSWORD: ckf_secret
      POSTGRES_DB: ckf_blog
    ports:
      - "5433:5432"
    volumes:
      - ckf_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ckf -d ckf_blog"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ckf-web-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: "postgresql://ckf:ckf_secret@db:5432/ckf_blog?schema=public"
      JWT_SECRET: "ckf-super-secret-production-jwt-key-2026"
      JWT_EXPIRES: "7d"
      COOKIE_SECURE: "false"
      CLIENT_ORIGIN: "http://localhost:5173,http://localhost:80,http://localhost"
      UPLOAD_DIR: "./uploads"
      MAX_UPLOAD_MB: "10"
    ports:
      - "4000:4000"
    volumes:
      - ckf_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: ckf-web-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "5173:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  ckf_pgdata:
    name: ckf_pgdata
  ckf_uploads:
    name: ckf_uploads
